<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Player Collabs</title>
  <defs>
    <clipPath id="left"><circle cx="25" cy="32" r="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="#2563eb"/>
  <!-- Two players (rings) meeting; the shared space between them is lit -->
  <circle cx="39" cy="32" r="14" fill="#93c5fd" clip-path="url(#left)"/>
  <circle cx="25" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="39" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="5"/>
</svg>
